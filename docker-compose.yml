services:
  db-ditcash:
    image: mysql:8.0
    container_name: db_ditcash
    restart: always
    environment:
      MYSQL_DATABASE: ditcash_db
      MYSQL_ROOT_PASSWORD: Wildantec2026
    volumes:
      - ditcash_mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  app-ditcash:
    build: .
    container_name: app_ditcash
    restart: always
    depends_on:
      - db-ditcash 
    command: node server.js
    environment:
      DATABASE_URL: "mysql://root:Wildantec2026@db-ditcash:3306/ditcash_db"
      NODE_ENV: production
      API_CONTABLE_URL: "https://grupoaraujos.cloud"
      API_CONTABLE_EMAIL: "soporte@disar-ec.com"
      API_CONTABLE_PASSWORD: "admin123"
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3001:3000"
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 256M

volumes:
  ditcash_mysql_data:
    name: clientes-app-main_ditcash_mysql_data
    external: true